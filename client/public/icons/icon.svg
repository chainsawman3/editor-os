<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="clapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />

  <!-- Outer glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.3" />

  <!-- Clapperboard / Video Slate Icon -->
  <g transform="translate(106, 116)">
    <!-- Slate Body -->
    <rect x="0" y="90" width="300" height="200" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="6" />
    
    <!-- Cut Accent Lines in Slate -->
    <line x1="40" y1="150" x2="140" y2="150" stroke="#71717a" stroke-width="6" stroke-linecap="round" />
    <line x1="40" y1="190" x2="200" y2="190" stroke="#52525b" stroke-width="6" stroke-linecap="round" />
    <line x1="40" y1="230" x2="110" y2="230" stroke="#3f3f46" stroke-width="6" stroke-linecap="round" />

    <!-- Play Triangle -->
    <polygon points="210,170 210,230 260,200" fill="url(#accentGrad)" />

    <!-- Clapper Top Bar (Angled) -->
    <g transform="rotate(-12, 0, 80)">
      <rect x="0" y="20" width="300" height="60" rx="12" fill="#27272a" stroke="#52525b" stroke-width="5" />
      <!-- Stripes -->
      <polygon points="30,20 65,20 45,80 10,80" fill="url(#clapperGrad)" />
      <polygon points="95,20 130,20 110,80 75,80" fill="url(#clapperGrad)" />
      <polygon points="160,20 195,20 175,80 140,80" fill="url(#clapperGrad)" />
      <polygon points="225,20 260,20 240,80 205,80" fill="url(#clapperGrad)" />
    </g>
  </g>
</svg>
