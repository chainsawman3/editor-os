<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Slate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#09090d" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.5" />
    </linearGradient>

    <!-- Primary Flow Stream (Cyan -> Blue -> Indigo -> Violet) -->
    <linearGradient id="flowPrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Secondary Wave Stream (Violet -> Fuchsia -> Pink) -->
    <linearGradient id="flowSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Accent Cyan Glow -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Ambient Blur -->
    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" result="blur" />
    </filter>

    <!-- Vector Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Dark Squircle Canvas -->
  <rect x="14" y="14" width="484" height="484" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Ambient Backlight Glow -->
  <circle cx="230" cy="220" r="140" fill="#6366f1" opacity="0.2" filter="url(#ambientBlur)" />
  <circle cx="300" cy="290" r="120" fill="#00f2fe" opacity="0.18" filter="url(#ambientBlur)" />

  <!-- Flow OS Geometric Monogram -->
  <g filter="url(#logoShadow)">
    <!-- Primary Flow Stream: Sweeping Upper Arch + Vertical Spine (The 'F' Body) -->
    <path
      d="M 152 384
         L 152 188
         C 152 154, 178 128, 212 128
         L 336 128
         C 358 128, 376 146, 376 168
         C 376 190, 358 208, 336 208
         L 236 208
         C 220 208, 208 220, 208 236
         L 208 384
         C 208 400, 196 412, 180 412
         C 164 412, 152 400, 152 384 Z"
      fill="url(#flowPrimary)"
    />

    <!-- Secondary Momentum Wave: Mid Dynamic Horizontal Jet with Speed Taper -->
    <path
      d="M 236 244
         C 236 230, 248 218, 262 218
         L 316 218
         C 342 218, 364 240, 364 266
         C 364 292, 342 314, 316 314
         L 262 314
         C 248 314, 236 302, 236 288 Z"
      fill="url(#flowSecondary)"
    />

    <!-- Speed Flow Accent Blade (Bottom dynamic pulse) -->
    <path
      d="M 248 344
         C 248 333, 257 324, 268 324
         L 288 324
         C 304 324, 316 336, 316 352
         C 316 368, 304 380, 288 380
         L 268 380
         C 257 380, 248 371, 248 360 Z"
      fill="#38bdf8"
      opacity="0.85"
    />

    <!-- Glowing Energy Sparkles / Orbs -->
    <circle cx="336" cy="168" r="10" fill="#ffffff" />
    <circle cx="316" cy="266" r="7" fill="#ffffff" />
  </g>
</svg>
