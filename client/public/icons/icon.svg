<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.4" />
    </linearGradient>

    <!-- Primary Flow / Monogram Gradient -->
    <linearGradient id="primaryFlowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Core Ambient Glow -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <!-- Vector Drop Shadow -->
    <filter id="vectorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Light Core -->
  <circle cx="256" cy="256" r="130" fill="#6366f1" opacity="0.22" filter="url(#ambientGlow)" />
  <circle cx="256" cy="256" r="90" fill="#38bdf8" opacity="0.18" filter="url(#ambientGlow)" />

  <!-- Monogram Vector -->
  <g filter="url(#vectorShadow)">
    <path
      d="M 112 360
         V 196
         C 112 160, 138 136, 172 150
         L 256 190
         L 340 150
         C 374 136, 400 160, 400 196
         V 360"
      stroke="url(#primaryFlowGrad)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Mid Flow Beam -->
    <path
      d="M 190 286 L 256 248 L 322 286"
      stroke="#38bdf8"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.9"
      fill="none"
    />
  </g>
</svg>
